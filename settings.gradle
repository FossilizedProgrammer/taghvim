pluginManagement {
    repositories {
        // dl.google.com در بعضی شبکه‌ها (از جمله ایران) مسدود است؛
        // به همین دلیل آینه‌ها قبل از مخازن اصلی چک می‌شوند.
        mavenCentral()
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/google' }
