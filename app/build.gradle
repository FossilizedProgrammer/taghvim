plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.taghvim.lockcalendar'
    compileSdk 34

    defaultConfig {
        applicationId "com.taghvim.lockcalendar"
        minSdk 26          // اندروید ۸
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // کلید امضا: app/taghvim.jks (برای آپدیت‌های بعدی همین کلید لازم است)
    signingConfigs {
        release {
            storeFile file('taghvim.jks')
            storePassword "taghvim1405"
            keyAlias "taghvim"
            keyPassword "taghvim1405"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
