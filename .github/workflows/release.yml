name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TAGHVM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "secret TAGHVM_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/taghvim.jks

      - name: Build release APK
        env:
          TAGHVM_STORE_FILE: ${{ github.workspace }}/app/taghvim.jks
          TAGHVM_STORE_PASSWORD: ${{ secrets.TAGHVM_STORE_PASSWORD }}
          TAGHVM_KEY_ALIAS: ${{ secrets.TAGHVM_KEY_ALIAS }}
          TAGHVM_KEY_PASSWORD: ${{ secrets.TAGHVM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk \
             "Persian-Calendar-${VERSION}-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Persian-Calendar-*-release.apk
          generate_release_notes: true
